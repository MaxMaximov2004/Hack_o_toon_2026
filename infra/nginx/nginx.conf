# =====================================================================
# nginx — единая точка входа. Ведёт: Java #2 (техлид).
# Адреса сервисов резолвятся в момент запроса (resolver + переменные),
# поэтому nginx стартует, даже если какой-то сервис ещё не собран:
# такой маршрут просто отдаст 502, остальные работают.
# =====================================================================
server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;   # DNS docker-сети
    client_max_body_size 10m;                 # загрузка CSV клиентов

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    set $auth     http://auth-service:8081;
    set $core     http://core-api:8080;
    set $export   http://export-service:8082;
    set $notifier http://notifier:8083;

    # ---- внутренние эндпоинты наружу не отдаём ----
    location /internal/ { return 404; }

    # ---- API: самый длинный префикс выигрывает ----
    location /api/auth/          { proxy_pass $auth; }
    location /api/export/        { proxy_pass $export; }
    location /api/calc/          { proxy_pass $export; }
    location /api/subscriptions  { proxy_pass $notifier; }
    location /api/notifications  { proxy_pass $notifier; }
    location /api/               { proxy_pass $core; }

    # ---- Swagger core-api (без авторизации, см. 03-java-2-techlead) ----
    location /swagger-ui         { proxy_pass $core; }
    location /v3/api-docs        { proxy_pass $core; }

    # ---- проверка живости для техлида (infra/smoke.sh) ----
    location = /healthz/auth     { proxy_pass $auth/health; }
    location = /healthz/core     { proxy_pass $core/health; }
    location = /healthz/export   { proxy_pass $export/health; }
    location = /healthz/notifier { proxy_pass $notifier/health; }

    # ---- фронт (SPA): неизвестные пути -> index.html ----
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
