# =====================================================================
# auth-stub — подмена auth-service, пока Go не готов (профиль auth-stub в compose).
# Отдаёт только /health и dev-JWKS. Входа нет: токен — mint-token.sh.
# Ведёт: техлид.
# =====================================================================
server {
    listen 8081;
    default_type application/json;

    location = /health              { return 200 '{"status":"ok"}'; }
    location = /internal/auth/jwks  { alias /keys/jwks.json; }

    location / {
        return 503 '{"error":{"code":"UPSTREAM_UNAVAILABLE","message":"auth-stub: входа нет, токен — contracts/dev-keys/mint-token.sh","details":null}}';
    }
}
