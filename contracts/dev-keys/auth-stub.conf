# =====================================================================
# auth-stub — подмена auth-service, пока Go не готов (профиль auth-stub в compose).
# Отдаёт /health, dev-JWKS и упрощённый вход, чтобы пройти фронт в браузере:
#   POST /api/auth/login       — ЛЮБЫЕ email и пароль -> mfaToken
#   POST /api/auth/2fa/verify  — ЛЮБОЙ код -> accessToken (JWT dev-ключа, роль manager)
#   GET  /api/auth/me          — демо-пользователь
# Неверный пароль / код здесь не проверяются — это делает настоящий auth-service.
# Токен подписан contracts/dev-keys/jwt-dev-private.pem, действует до 2027-10-24. Перевыпустить:
#   TTL=31536000 bash contracts/dev-keys/mint-token.sh  -> вставить в accessToken ниже.
# Ведёт: техлид.
# =====================================================================
server {
    listen 8081;
    default_type application/json;

    location = /health              { return 200 '{"status":"ok"}'; }
    location = /internal/auth/jwks  { alias /keys/jwks.json; }

    location = /api/auth/login {
        return 200 '{"mfaToken":"stub-mfa-token","mfaSetupRequired":false}';
    }
    location = /api/auth/2fa/verify {
        return 200 '{"accessToken":"eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6ImRldi0xIn0.eyJpc3MiOiJyYWRhci1hdXRoIiwic3ViIjoiMSIsImVtYWlsIjoiZGVtb0BydC5ydSIsIm5hbWUiOiLQlNC10LzQviDQnNC10L3QtdC00LbQtdGAIiwicm9sZXMiOlsibWFuYWdlciJdLCJhbXIiOlsicHdkIiwib3RwIl0sImlhdCI6MTc5MjgxMDQ0MCwiZXhwIjoxODI0MzQ2NDQwLCJqdGkiOiJlMDBmYzVmYTRkZTgyNDMwOGVlZWE3YTk3YjVhYmFmMSJ9.GiSEsAp5KumAbUc_qXN8dGJ5CB4nU_KgOL8qyI0-Bxaulj_DMg0n-ER307jVSWayQpQt1E16k5u52zD_125plN0sAL4H2ugvQd_rzlARRkt9VMlQtpTFZSpqr9XcaqWLSZl0KGFYL0ImNatnC4Zx-8fGwI1L6OMn4mazXMnTVSFcz99ybwN42kzAe6eGoLZZtdaC6KLwE7BMBfVuwu9Iodj2F7ewhOwY9dHDrIhLp45mspT6hkmfZdqF5rpeY2mfgZRyzdAAGnE_xf0CoE_6bpfcsPlzigfDZbgA3OLnqqlolGhM6RgyrXtUFFFJMrpbwtL8COTgkk-JYL18dBzPng","expiresIn":28800,"user":{"id":1,"email":"demo@rt.ru","fullName":"Демо Менеджер","roles":["manager"]}}';
