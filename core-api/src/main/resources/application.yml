# Конфиг только из переменных окружения (имена — как в docker-compose.yml):
# SERVER_PORT, SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
# AUTH_JWKS_URL, INTERNAL_TOKEN. Схема БД — только infra/db/init, из кода ничего не создаём.
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: core-api
  main:
    banner-mode: off
  datasource:
    hikari:
      # Старт без БД: пул не пытается подключиться при запуске, /health ответит 503, пока Postgres не поднимется.
      initialization-fail-timeout: -1
      connection-timeout: 2000
      maximum-pool-size: 10
      pool-name: core-hikari
      # План под реальные значения параметров. Иначе с 5-го вызова JDBC Postgres берёт общий план, для
      # окна карты (lat/lon BETWEEN :…) ждёт 5 строк вместо десятков тысяч и идёт по индексу — в 2–3 раза медленнее.
      connection-init-sql: SET plan_cache_mode = force_custom_plan
  sql:
    init:
      mode: never
  jackson:
    default-property-inclusion: always
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # POST /api/clients/import — CSV до 10 МБ (больше — 413 из GlobalExceptionHandler); nginx пропускает 10m
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: false
    async:
      # /internal/companies отдаётся потоком: до 100 000 строк медленному потребителю — не обрывать через 30 с
      request-timeout: 5m

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    # токен из Authorize не теряется при перезагрузке страницы (хранится в браузере)
    persist-authorization: true

# Зарезервировано для common/ (Java #2): JWT по JWKS и X-Internal-Token.
radar:
  auth-jwks-url: ${AUTH_JWKS_URL:}
  internal-token: ${INTERNAL_TOKEN:}

logging:
  level:
    root: INFO
